name: ${COMPOSE_PROJECT_NAME:-creatormind}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creatormind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creatormind_dev}
      POSTGRES_DB: ${POSTGRES_DB:-creatormind}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creatormind} -d ${POSTGRES_DB:-creatormind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6382}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-creatormind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-creatormind_dev_secret}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data


  backend:
    profiles: ["full"]
    build:
      context: ./backend
    command: >
      /bin/sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      CREATORMIND_ENVIRONMENT: development
      CREATORMIND_DEBUG: "true"
      CREATORMIND_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creatormind}:${POSTGRES_PASSWORD:-creatormind_dev}@postgres:5432/${POSTGRES_DB:-creatormind}
      CREATORMIND_REDIS_URL: redis://redis:6379/0
      CREATORMIND_CELERY_BROKER_URL: redis://redis:6379/1
      CREATORMIND_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CREATORMIND_CORS_ORIGINS: http://localhost:${VITE_PORT:-5173}
      CREATORMIND_S3_ENDPOINT_URL: http://minio:9000
      CREATORMIND_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-creatormind}
      CREATORMIND_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-creatormind_dev_secret}
      CREATORMIND_S3_BUCKET: ${S3_BUCKET:-creatormind}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["full"]
    build:
      context: ./backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    environment:
      CREATORMIND_ENVIRONMENT: development
      CREATORMIND_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-creatormind}:${POSTGRES_PASSWORD:-creatormind_dev}@postgres:5432/${POSTGRES_DB:-creatormind}
      CREATORMIND_REDIS_URL: redis://redis:6379/0
      CREATORMIND_CELERY_BROKER_URL: redis://redis:6379/1
      CREATORMIND_CELERY_RESULT_BACKEND: redis://redis:6379/2
      CREATORMIND_S3_ENDPOINT_URL: http://minio:9000
      CREATORMIND_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-creatormind}
      CREATORMIND_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-creatormind_dev_secret}
      CREATORMIND_S3_BUCKET: ${S3_BUCKET:-creatormind}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_PROXY_TARGET: http://backend:8000
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules: